<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="760" height="480" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1c2c45" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="760" y2="40"/>
    <line x1="0" y1="120" x2="760" y2="120"/>
    <line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="0" y1="280" x2="760" y2="280"/>
    <line x1="0" y1="360" x2="760" y2="360"/>
  </g>

  <!-- top bar -->
  <rect x="0" y="0" width="760" height="56" fill="#0a0f1f" opacity="0.9"/>
  <circle cx="30" cy="28" r="8" fill="#34d399"/>
  <text x="50" y="33" font-family="monospace" font-size="15" fill="#e8f1fb" font-weight="600">QA Studio</text>
  <text x="640" y="33" font-family="monospace" font-size="11" fill="#5b6b85">3 free uses left</text>

  <!-- left nav cards -->
  <g font-family="monospace" font-size="11" fill="#7dd3fc">
    <rect x="24" y="80" width="150" height="56" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="40" y="102" font-size="16">📝</text>
    <text x="40" y="120">Bug Report</text>

    <rect x="24" y="146" width="150" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="40" y="168" font-size="16">🧠</text>
    <text x="40" y="186">AI Review</text>

    <rect x="24" y="212" width="150" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="40" y="234" font-size="16">🗂️</text>
    <text x="40" y="252">Saved Reports</text>
  </g>

  <!-- main panel -->
  <rect x="196" y="80" width="540" height="360" rx="16" fill="#0c1322" stroke="#1f2c44"/>

  <text x="222" y="118" font-family="monospace" font-size="13" fill="#5b6b85" letter-spacing="2">BUG REPORT</text>

  <rect x="222" y="136" width="488" height="64" rx="8" fill="#0a0f1f" stroke="#243352"/>
  <text x="236" y="160" font-family="monospace" font-size="11" fill="#5b6b85">Issue context</text>
  <text x="236" y="180" font-family="monospace" font-size="11" fill="#a9b8cf">Slot reel desync after rapid spin-stop on build 4.12...</text>

  <rect x="222" y="214" width="232" height="92" rx="8" fill="#0a0f1f" stroke="#243352"/>
  <text x="236" y="236" font-family="monospace" font-size="11" fill="#34d399">✓ Steps to reproduce</text>
  <line x1="236" y1="252" x2="430" y2="252" stroke="#1f2c44"/>
  <line x1="236" y1="268" x2="410" y2="268" stroke="#1f2c44"/>
  <line x1="236" y1="284" x2="420" y2="284" stroke="#1f2c44"/>

  <rect x="478" y="214" width="232" height="92" rx="8" fill="#0a0f1f" stroke="#243352"/>
  <text x="492" y="236" font-family="monospace" font-size="11" fill="#fbbf24">⚠ Expected behavior</text>
  <line x1="492" y1="252" x2="680" y2="252" stroke="#1f2c44"/>
  <line x1="492" y1="268" x2="660" y2="268" stroke="#1f2c44"/>

  <rect x="222" y="322" width="488" height="98" rx="8" fill="#0a0f1f" stroke="#243352"/>
  <text x="236" y="344" font-family="monospace" font-size="11" fill="url(#accent)">🐛 Generated Bug Report</text>
  <line x1="236" y1="362" x2="690" y2="362" stroke="#1f2c44"/>
  <line x1="236" y1="378" x2="660" y2="378" stroke="#1f2c44"/>
  <line x1="236" y1="394" x2="670" y2="394" stroke="#1f2c44"/>

  <rect x="556" y="118" width="154" height="34" rx="8" fill="url(#purpleAccent)"/>
  <text x="600" y="140" font-family="monospace" font-size="12" fill="#020617" font-weight="700">Generate ✦</text>

</svg>
